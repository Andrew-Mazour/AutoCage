[package]
name = "autocage"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Fail-closed Bubblewrap runner for coding tasks"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
