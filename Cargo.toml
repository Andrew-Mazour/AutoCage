[package]
name = "autocage"
version = "0.1.0-rc.1"
authors = ["Andrew Mazour"]
edition = "2021"
rust-version = "1.75"
description = "Fail-closed Linux runner and security evidence for coding-agent evaluations"
license = "Apache-2.0"
repository = "https://github.com/Andrew-Mazour/AutoCage"
documentation = "https://github.com/Andrew-Mazour/AutoCage/tree/main/docs"
homepage = "https://github.com/Andrew-Mazour/AutoCage"
include = ["/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/src/**", "/tests/**"]

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
lto = true
codegen-units = 1
strip = true
